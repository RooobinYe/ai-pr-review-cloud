{{- if not .Values.github.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aprc.githubSecret" . }}
  labels: {{- include "aprc.labels" . | nindent 4 }}
stringData:
  webhook-secret: {{ required "github.webhookSecret is required when github.existingSecret is empty" .Values.github.webhookSecret | quote }}
  {{- with .Values.github.appId }}
  app-id: {{ . | quote }}
  {{- end }}
  {{- with .Values.github.privateKey }}
  private-key: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if not .Values.llm.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aprc.llmSecret" . }}
  labels: {{- include "aprc.labels" . | nindent 4 }}
stringData:
  LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
{{- end }}
{{- if .Values.postgres.dev.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aprc.databaseSecret" . }}
  labels: {{- include "aprc.labels" . | nindent 4 }}
stringData:
  DATABASE_URL: {{ printf "postgres://postgres:%s@%s-postgres:5432/postgres?sslmode=disable" .Values.postgres.dev.password (include "aprc.fullname" .) | quote }}
{{- end }}
