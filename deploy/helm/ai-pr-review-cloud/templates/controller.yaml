{{- $sel := dict "root" . "component" "controller" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aprc.fullname" . }}-controller
  labels: {{- include "aprc.labels" . | nindent 4 }}
---
# The controller creates and observes runner Jobs in its own namespace, and
# creates each Job's Secret holding the run's credentials.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aprc.fullname" . }}-controller
  labels: {{- include "aprc.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aprc.fullname" . }}-controller
  labels: {{- include "aprc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aprc.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "aprc.fullname" . }}-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aprc.fullname" . }}-controller
  labels:
    {{- include "aprc.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels: {{- include "aprc.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aprc.selector" $sel | nindent 8 }}
    spec:
      serviceAccountName: {{ include "aprc.fullname" . }}-controller
      securityContext: {{- include "aprc.podSecurityContext" . | nindent 8 }}
      containers:
        - name: controller
          image: {{ include "aprc.image" $sel }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ include "aprc.databaseSecret" . }}, key: DATABASE_URL }
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef: { name: {{ include "aprc.githubSecret" . }}, key: app-id, optional: true }
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "aprc.githubSecret" . }}, key: private-key, optional: true }
            - name: RUNNER_IMAGE
              value: {{ include "aprc.image" (dict "root" . "component" "runner") }}
            - name: FETCH_IMAGE
              value: {{ include "aprc.image" (dict "root" . "component" "fetch") }}
            - name: IMAGE_PULL_POLICY
              value: {{ .Values.image.pullPolicy }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - name: CONTROLLER_URL
              value: {{ printf "http://%s-controller.%s.svc" (include "aprc.fullname" .) .Release.Namespace | quote }}
            - name: LITELLM_URL
              value: {{ include "aprc.litellmURL" . | quote }}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "aprc.litellmSecret" . }}, key: master-key }
            - name: FETCH_EGRESS_HOSTS
              value: {{ join "," .Values.runs.fetchEgressHosts | quote }}
            - name: LLM_PROVIDER
              value: {{ .Values.llm.provider | quote }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            # Runners reach the model only through LiteLLM.
            - name: LLM_BASE_URL
              value: {{ include "aprc.litellmURL" . | quote }}
            - name: LLM_THINKING
              value: {{ .Values.llm.thinking | quote }}
            - name: REVIEW_LANGUAGE
              value: {{ .Values.runs.language | quote }}
            - name: MAX_RUNNING
              value: {{ .Values.runs.maxRunning | quote }}
            - name: MAX_ATTEMPTS
              value: {{ .Values.runs.maxAttempts | quote }}
            - name: REDELIVER_INTERVAL
              value: {{ .Values.webhooks.redeliverInterval | quote }}
            - name: RUNNER_DEADLINE_SECONDS
              value: {{ .Values.runs.deadlineSeconds | quote }}
            - name: RUNNER_RESOURCES
              value: {{ toJson .Values.runner.resources | quote }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources: {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext: {{- include "aprc.containerSecurityContext" . | nindent 12 }}
---
# Runner callbacks (result, session snapshot, usage) and fetch's egress proxy
# to GitHub arrive here.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aprc.fullname" . }}-controller
  labels:
    {{- include "aprc.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  selector: {{- include "aprc.selector" $sel | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
