{{- $sel := dict "root" . "component" "litellm" -}}
{{- $secretName := include "aprc.litellmSecret" . -}}
{{- $masterKey := .Values.litellm.masterKey -}}
{{- if not $masterKey -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if and $existing (hasKey $existing.data "master-key") -}}
{{- $masterKey = index $existing.data "master-key" | b64dec -}}
{{- else -}}
{{- $masterKey = printf "sk-%s" (randAlphaNum 40) -}}
{{- end -}}
{{- end -}}
# The LiteLLM proxy is the only holder of the real model key. The controller
# uses the master key to issue each run a virtual key with the run's budget
# (docs/architecture.md §5, §7.3).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels: {{- include "aprc.labels" . | nindent 4 }}
stringData:
  master-key: {{ $masterKey | quote }}
  {{- if .Values.postgres.dev.enabled }}
  DATABASE_URL: {{ printf "postgres://postgres:%s@%s-postgres:5432/litellm?sslmode=disable" .Values.postgres.dev.password (include "aprc.fullname" .) | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aprc.fullname" . }}-litellm
  labels: {{- include "aprc.labels" . | nindent 4 }}
data:
  config.yaml: |
    model_list:
      - model_name: {{ .Values.llm.model | quote }}
        litellm_params:
          model: {{ .Values.llm.upstream.model | quote }}
          api_key: os.environ/LLM_API_KEY
          {{- with .Values.llm.upstream.apiBase }}
          api_base: {{ . | quote }}
          {{- end }}
          {{- with .Values.llm.upstream.allowedParams }}
          allowed_openai_params: {{ toJson . }}
          {{- end }}
        model_info:
          input_cost_per_token: {{ printf "%.12f" (divf .Values.llm.pricing.input 1000000) }}
          output_cost_per_token: {{ printf "%.12f" (divf .Values.llm.pricing.output 1000000) }}
          cache_read_input_token_cost: {{ printf "%.12f" (divf .Values.llm.pricing.cacheRead 1000000) }}
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aprc.fullname" . }}-litellm
  labels:
    {{- include "aprc.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "aprc.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aprc.selector" $sel | nindent 8 }}
      annotations:
        # Restart on config changes; LiteLLM reads its config once.
        checksum/config: {{ printf "%s%s" .Values.llm .Values.litellm | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "aprc.podSecurityContext" . | nindent 8 }}
        # The image's default user is root.
        runAsUser: 65532
        runAsGroup: 65532
      {{- if .Values.postgres.dev.enabled }}
      initContainers:
        # LiteLLM keeps its keys and spend in a database of its own.
        - name: create-database
          image: {{ .Values.postgres.dev.image }}
          command:
            - sh
            - -c
            - |
              until pg_isready -q -h {{ include "aprc.fullname" . }}-postgres; do sleep 2; done
              psql -h {{ include "aprc.fullname" . }}-postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'litellm'" | grep -q 1 \
                || psql -h {{ include "aprc.fullname" . }}-postgres -c "CREATE DATABASE litellm"
          env:
            - { name: PGUSER, value: postgres }
            - name: PGPASSWORD
              value: {{ .Values.postgres.dev.password | quote }}
          securityContext: {{- include "aprc.containerSecurityContext" . | nindent 12 }}
      {{- end }}
      containers:
        - name: litellm
          image: {{ .Values.litellm.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - { name: http, containerPort: 4000 }
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "aprc.llmSecret" . }}, key: LLM_API_KEY }
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef: { name: {{ $secretName }}, key: master-key }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ include "aprc.litellmDatabaseSecret" . }}, key: DATABASE_URL }
          volumeMounts:
            - { name: config, mountPath: /etc/litellm, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            # Startup runs LiteLLM's database migrations.
            httpGet: { path: /health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/readiness, port: http }
          livenessProbe:
            httpGet: { path: /health/liveliness, port: http }
          resources: {{- toYaml .Values.litellm.resources | nindent 12 }}
          securityContext: {{- include "aprc.containerSecurityContext" . | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "aprc.fullname" . }}-litellm
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aprc.fullname" . }}-litellm
  labels:
    {{- include "aprc.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
spec:
  selector: {{- include "aprc.selector" $sel | nindent 4 }}
  ports:
    - { name: http, port: 4000, targetPort: http }
