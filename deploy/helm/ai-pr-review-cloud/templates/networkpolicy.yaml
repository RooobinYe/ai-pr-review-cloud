{{- if .Values.networkPolicy.enabled }}
# Runner Pods reach only DNS, LiteLLM and the controller (docs/architecture.md
# §5). The policy covers the whole Pod, so fetch reaches GitHub through the
# controller's egress proxy, which the runner container cannot authenticate to.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aprc.fullname" . }}-runner
  labels: {{- include "aprc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-pr-review-cloud
      app.kubernetes.io/component: runner
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.dns.namespace }} }
          podSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.dns.podLabels | nindent 14 }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels: {{- include "aprc.selector" (dict "root" . "component" "litellm") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 4000 }
    - to:
        - podSelector:
            matchLabels: {{- include "aprc.selector" (dict "root" . "component" "controller") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8080 }
{{- if .Values.preview.enabled }}
    {{- if not .Values.preview.apiServerCIDRs }}
    {{- fail "preview.apiServerCIDRs must include Kubernetes Service and API endpoint IPs" }}
    {{- end }}
    - to:
        {{- range .Values.preview.apiServerCIDRs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
{{- end }}
---
# Only runners and the controller talk to the model proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aprc.fullname" . }}-litellm
  labels: {{- include "aprc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "aprc.selector" (dict "root" . "component" "litellm") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ai-pr-review-cloud
              app.kubernetes.io/component: runner
        - podSelector:
            matchLabels: {{- include "aprc.selector" (dict "root" . "component" "controller") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 4000 }
{{- end }}
