image:
  # Images are named <registry>/ai-pr-review-cloud-<component>:<tag>.
  registry: local
  tag: dev
  pullPolicy: IfNotPresent

github:
  # Existing Secret with keys `webhook-secret`, `app-id` and `private-key`.
  existingSecret: ""
  # Used to create that Secret when existingSecret is empty. Development only.
  webhookSecret: ""
  appId: ""
  # The App's PEM private key; pass it with --set-file github.privateKey=<path>.
  # Without appId and privateKey the controller starts but leaves runs queued.
  privateKey: ""

llm:
  # Existing Secret with key `LLM_API_KEY`: the real model key. Only the
  # LiteLLM proxy reads it; runners get per-run virtual keys.
  existingSecret: ""
  # Used to create that Secret when existingSecret is empty. Development only.
  apiKey: ""
  # What runners ask for: a pi provider and model id (docs/architecture.md §4.5).
  provider: deepseek
  model: deepseek-flash
  thinking: high
  # Where LiteLLM sends those requests (its litellm_params).
  upstream:
    model: deepseek/deepseek-flash
    # Overrides the provider's default endpoint.
    apiBase: ""
    # Request fields LiteLLM would otherwise drop; pi sends reasoning_effort
    # for DeepSeek's thinking levels.
    allowedParams: [reasoning_effort]
  # USD per million tokens. LiteLLM charges each run's virtual key at these
  # prices and refuses requests once the run's budget is spent.
  pricing:
    input: 0.3
    output: 1.2
    cacheRead: 0.006

litellm:
  image: ghcr.io/berriai/litellm:v1.104.2
  # Master key for managing virtual keys; generated and kept across upgrades
  # when empty. Must start with "sk-".
  masterKey: ""
  # Existing Secret with key `DATABASE_URL` for LiteLLM's own database. With
  # postgres.dev.enabled a `litellm` database is created on the dev server.
  database:
    existingSecret: ""
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }

runs:
  # Budget recorded for each run until repositories configure their own (M4).
  budgetUSD: 0.5
  # Runs with a live runner Job; the rest wait in the queue.
  maxRunning: 4
  # Language of review comments.
  language: English
  # Hard limit on one runner Job (activeDeadlineSeconds). A run that hits it fails.
  deadlineSeconds: 1800
  # host:port pairs fetch may reach through the controller's egress proxy.
  # The runner network policy blocks every other destination outside the cluster.
  fetchEgressHosts: [github.com:443, api.github.com:443]

  maxAttempts: 3

networkPolicy:
  # Confine runner Pods to DNS, LiteLLM and the controller. Needs a CNI that
  # enforces NetworkPolicy (Kind's kindnet does).
  enabled: true
  # Where cluster DNS runs.
  dns:
    namespace: kube-system
    podLabels: { k8s-app: kube-dns }

webhooks:
  # How often the controller redelivers webhooks the gateway failed to
  # accept; 0 disables it. Deliveries through smee.io look successful to
  # GitHub, so this only helps when GitHub reaches the gateway directly.
  redeliverInterval: 5m

database:
  # Existing Secret with key `DATABASE_URL`. Ignored when postgres.dev.enabled is true.
  existingSecret: ""

postgres:
  dev:
    # Single-replica, non-persistent PostgreSQL for local Kind clusters only.
    enabled: true
    image: postgres:17
    password: dev-only-password

monitoring:
  dev:
    # Single-replica, non-persistent Prometheus and Grafana with the cost
    # dashboard (dashboards/review-cost.json), for local Kind clusters only.
    # Elsewhere, scrape the controller Service's /metrics and import the JSON.
    enabled: true
    scrapeInterval: 15s
    prometheus:
      image: prom/prometheus:v3.5.0
      retention: 7d
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { memory: 512Mi }
    grafana:
      image: grafana/grafana:12.1.0
      # Anonymous viewers can read the dashboard; editing needs admin.
      adminPassword: dev-only-password
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { memory: 256Mi }

gateway:
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

controller:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

runner:
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1536Mi }

# Explicit opt-in: provisions isolated namespaces with restricted application resources.
preview:
  enabled: false
  # Include Kubernetes Service IP and API endpoint IPs (CNI DNAT behavior varies).
  apiServerCIDRs: []
