image:
  # Images are named <registry>/ai-pr-review-cloud-<component>:<tag>.
  registry: local
  tag: dev
  pullPolicy: IfNotPresent

github:
  # Existing Secret with keys `webhook-secret`, `app-id` and `private-key`.
  existingSecret: ""
  # Used to create that Secret when existingSecret is empty. Development only.
  webhookSecret: ""
  appId: ""
  # The App's PEM private key; pass it with --set-file github.privateKey=<path>.
  # Without appId and privateKey the controller starts but leaves runs queued.
  privateKey: ""

llm:
  # Existing Secret with key `LLM_API_KEY`, handed to runner Pods.
  # M2 replaces it with per-run LiteLLM virtual keys.
  existingSecret: ""
  # Used to create that Secret when existingSecret is empty. Development only.
  apiKey: ""
  provider: deepseek
  model: deepseek-flash
  baseUrl: ""
  thinking: high

runs:
  # Budget recorded for each run until repositories configure their own (M4).
  budgetUSD: 0.5
  # Runs with a live runner Job; the rest wait in the queue.
  maxRunning: 4
  # Language of review comments.
  language: English
  # Hard limit on one runner Job (activeDeadlineSeconds).
  deadlineSeconds: 1800

database:
  # Existing Secret with key `DATABASE_URL`. Ignored when postgres.dev.enabled is true.
  existingSecret: ""

postgres:
  dev:
    # Single-replica, non-persistent PostgreSQL for local Kind clusters only.
    enabled: true
    image: postgres:17
    password: dev-only-password

monitoring:
  dev:
    # Single-replica, non-persistent Prometheus and Grafana with the cost
    # dashboard (dashboards/review-cost.json), for local Kind clusters only.
    # Elsewhere, scrape the controller Service's /metrics and import the JSON.
    enabled: true
    scrapeInterval: 15s
    prometheus:
      image: prom/prometheus:v3.5.0
      retention: 7d
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { memory: 512Mi }
    grafana:
      image: grafana/grafana:12.1.0
      # Anonymous viewers can read the dashboard; editing needs admin.
      adminPassword: dev-only-password
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { memory: 256Mi }

gateway:
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

controller:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

runner:
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1536Mi }
